; Daino — límites de upload alineados con UPLOAD_MAX_MB.
;
; PHP defaults son 2M/8M; demasiado bajos para un MP3 de hasta 10MB.
; Subimos a 12M (10MB con margen para encoding multipart). El controller
; valida el tamaño REAL contra UPLOAD_MAX_MB env via FileUploadService;
; estos límites son la red de seguridad de PHP antes de que la request
; llegue al script.
upload_max_filesize = 12M
post_max_size = 14M

; Opcional: permitir respuestas un poco más grandes si streamamos MP3s.
memory_limit = 128M
